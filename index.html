const T=[...new Set(N.map(n=>n.t))],cv=document.getElementById('c'),x=cv.getContext('2d'),q=document.getElementById('q'),res=document.getElementById('results'),panel=document.getElementById('panel');

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=(h^s.charCodeAt(i))*16777619;return h>>>0}

function select(n){sel=n; q.value=n.l;res.style.display='none';let peers=N.filter(a=>a!==n&&a.t===n.t).slice(0,5).map(a=>a.l);panel.style.display='block';panel.innerHTML=`<div class="eyebrow">${n.t}</div><h2>${n.l}</h2><div class="status">${n.s.replaceAll('_',' ')}</div><div class="copy">${n.s==='EVIDENCE_ANCHOR'?'Direct UK 18–24 and/or male-level evidence supports this as an anchor; the exact male × 18–24 intersection still depends on source.':n.s==='SUPPORTED_TERRITORY'?'Broader UK Gen Z / 16–24 evidence supports inclusion.':'Included in the discovery universe, but node-level UK male 18–24 measurement is still required before assigning a Cultural Score.'}</div><div class="near">SAME TERRITORY · <b>${peers.join(' · ')}</b></div>`;ox=W/2-sx(n)+ox;oy=H/2-sy(n)+oy}
